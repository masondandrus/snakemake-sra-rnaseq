# Minimal configuration used only for CI lint + dry-run.
# Includes a mixed paired/single-end sample sheet so both rule branches
# are exercised in the DAG.
samples: ".test/samples.tsv"

sra:
  max_size: "50g"

reference:
  transcriptome_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_45/gencode.v45.transcripts.fa.gz"
  genome_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_45/GRCh38.primary_assembly.genome.fa.gz"

fastp:
  extra: "--qualified_quality_phred 20 --length_required 30"

salmon:
  kmer: 31
  libtype: "A"
  extra: "--validateMappings --seqBias --gcBias --numBootstraps 30"

deseq2:
  design: "~ condition"
  min_count: 10
  min_samples: 3
  alpha: 0.05
  lfc_shrink: "apeglm"
  pca_group: "condition"

contrasts:
  treated_vs_control: ["condition", "treated", "control"]
