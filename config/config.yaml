# GSE42805 — chronic cocaine vs saline, mouse nucleus accumbens
# Feng et al. (2014) Genome Biology. 3 v 3, 101 bp single-end.
samples: "config/samples.tsv"

sra:
  max_size: "50g"

reference:
  transcriptome_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M39/gencode.vM39.transcripts.fa.gz"
  genome_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M39/GRCm39.primary_assembly.genome.fa.gz"

fastp:
  extra: "--qualified_quality_phred 20 --length_required 30"

salmon:
  kmer: 31
  libtype: "A"
  # --numBootstraps is deliberately absent: bootstraps are only used by
  # transcript-level uncertainty methods (Swish, sleuth). Standard DESeq2 on
  # point estimates ignores them, and they multiply quantification time.
  extra: "--validateMappings --seqBias"

deseq2:
  design: "~ condition"
  min_count: 10
  min_samples: 3
  alpha: 0.05
  lfc_shrink: "apeglm"
  pca_group: "condition"

enrichment:
  # msigdbr species name, e.g. "Mus musculus" or "Homo sapiens"
  species: "Mus musculus"
  min_size: 15
  max_size: 500

contrasts:
  cocaine_vs_saline: ["condition", "cocaine", "saline"]

# ---------------------------------------------------------------------------
# Multi-evidence convergence.
#
# Each entry in `axes` becomes one line of evidence. Types:
#   deseq2  this workflow's DE result
#   wgcna   hub genes from co-expression modules tracking the condition
#   eqtl    region-matched cis-eQTL genes (gtex | ratgtex | file)
#   gwas    genes mapped to trait-associated variants (GWAS Catalog)
#   file    any gene list you supply
#
# An axis whose `species` differs from annotation.species is reached by
# ortholog mapping, and every hit that needed one is flagged in the output.
# ---------------------------------------------------------------------------
annotation:
  enabled: true
  species: "Mus musculus"
  orthologs: true
  # Genes must hit these axes to appear at all. Empty = keep anything with
  # at least one line of evidence.
  require: ["DEG"]

  axes:
    - name: DEG
      type: deseq2
      alpha: 0.05

    - name: HUB
      type: wgcna

    - name: eQTL
      type: eqtl
      source: gtex              # gtex | ratgtex | file
      region: "Brain_Nucleus_accumbens_basal_ganglia"
      species: "Homo sapiens"
      qval: 0.05
      # url: null               # bulk file, or override the API path
      #
      # For rat work use RatGTEx, whose regions match the addiction
      # literature. Regions: NAcc IL PL OFC LHb pVTA RMTg BLA IC Brain
      #   source: ratgtex
      #   region: "NAcc"
      #   species: "Rattus norvegicus"

    - name: GWAS
      type: gwas
      species: "Homo sapiens"
      traits:
        - "MONDO_0005186"       # cocaine dependence
        - "EFO_0010445"         # cocaine use disorder
      pvalue: 5.0e-8

    # Extend with anything expressible as a gene list. The file needs a
    # gene_id and/or gene_symbol column; other columns carry through as
    # metadata prefixed with the axis name.
    #
    # - name: ATAC
    #   type: file
    #   path: "resources/annotation/atac_differential_peaks.tsv"
    #   species: "Mus musculus"

  wgcna:
    # WGCNA is unreliable below ~15 samples. Under this the rule writes an
    # empty hub table and convergence reports the axis as unavailable.
    min_samples: 15
    n_top_genes: 5000
    min_module_size: 30
    kme_threshold: 0.8
    power: "auto"
