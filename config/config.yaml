# GSE42805 — chronic cocaine vs saline, mouse nucleus accumbens
# Feng et al. (2014) Genome Biology. 3 v 3, 101 bp single-end.
samples: "config/samples.tsv"

sra:
  max_size: "50g"

reference:
  transcriptome_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M39/gencode.vM39.transcripts.fa.gz"
  genome_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M39/GRCm39.primary_assembly.genome.fa.gz"

fastp:
  extra: "--qualified_quality_phred 20 --length_required 30"

salmon:
  kmer: 31
  libtype: "A"
  # --numBootstraps is deliberately absent: bootstraps are only used by
  # transcript-level uncertainty methods (Swish, sleuth). Standard DESeq2 on
  # point estimates ignores them, and they multiply quantification time.
  extra: "--validateMappings --seqBias"

deseq2:
  design: "~ condition"
  min_count: 10
  min_samples: 3
  alpha: 0.05
  lfc_shrink: "apeglm"
  pca_group: "condition"

enrichment:
  # msigdbr species name, e.g. "Mus musculus" or "Homo sapiens"
  species: "Mus musculus"
  min_size: 15
  max_size: 500

contrasts:
  cocaine_vs_saline: ["condition", "cocaine", "saline"]
